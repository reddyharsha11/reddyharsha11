<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Harshavardhan Reddy — Software Developer and AI/ML Learner">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="45%" stop-color="#111a33"/>
      <stop offset="100%" stop-color="#0a0e1a"/>
    </linearGradient>

    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4f7cff"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>

    <radialGradient id="orbA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4f7cff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#4f7cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbC" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>

    <pattern id="brick" width="96" height="44" patternUnits="userSpaceOnUse">
      <rect width="96" height="44" fill="none"/>
      <path d="M0 43.5H96M48 0V43.5M0 0H96" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>

    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .orb { transform-box: view-box; }
    .a { animation: floatA 16s ease-in-out infinite; }
    .b { animation: floatB 19s ease-in-out infinite; }
    .c { animation: floatC 22s ease-in-out infinite; }
    @keyframes floatA {
      0%,100% { transform: translate(60px, 40px) scale(1); }
      50%     { transform: translate(200px, 120px) scale(1.15); }
    }
    @keyframes floatB {
      0%,100% { transform: translate(780px, 160px) scale(1.05); }
      50%     { transform: translate(640px, 60px) scale(0.92); }
    }
    @keyframes floatC {
      0%,100% { transform: translate(430px, 200px) scale(0.95); }
      50%     { transform: translate(560px, 90px) scale(1.2); }
    }
    .shimmer { animation: sweep 7s linear infinite; }
    @keyframes sweep {
      0%   { transform: translateX(-520px); }
      100% { transform: translateX(1320px); }
    }
    .pulse { animation: pulse 3.4s ease-in-out infinite; }
    @keyframes pulse {
      0%,100% { opacity: 0.55; }
      50%     { opacity: 1; }
    }
    .rule { stroke-dasharray: 220; stroke-dashoffset: 220; animation: draw 1.6s ease-out forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
  </style>

  <!-- wallpaper base -->
  <rect width="1200" height="320" fill="url(#wall)"/>
  <rect width="1200" height="320" fill="url(#brick)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>

  <!-- glowing orbs -->
  <g filter="url(#soft)" opacity="0.9">
    <circle class="orb a" cx="0" cy="0" r="150" fill="url(#orbA)"/>
    <circle class="orb b" cx="0" cy="0" r="170" fill="url(#orbB)"/>
    <circle class="orb c" cx="0" cy="0" r="130" fill="url(#orbC)"/>
  </g>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="34"/>
  </filter>

  <!-- moving light sweep -->
  <g class="shimmer">
    <rect x="0" y="-60" width="260" height="440" fill="url(#sweep)" transform="skewX(-18)"/>
  </g>

  <!-- top / bottom shade -->
  <rect width="1200" height="140" fill="url(#fade)"/>

  <!-- corner mark -->
  <g class="pulse">
    <rect x="70" y="96" width="46" height="5" rx="2.5" fill="url(#accent)"/>
  </g>

  <!-- name + role -->
  <text x="70" y="176"
        font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="58" font-weight="700" letter-spacing="1.5" fill="#ffffff">
    Harshavardhan Reddy
  </text>
  <text x="70" y="216"
        font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="21" font-weight="500" letter-spacing="0.6" fill="#9fb0cc">
    Software Developer  ·  AI/ML Learner  ·  BITS Pilani &amp; NxtWave
  </text>

  <line class="rule" x1="70" y1="248" x2="290" y2="248" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>

  <text x="70" y="282"
        font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="17" font-weight="400" letter-spacing="0.4" fill="#7b8bab">
    Building full-stack products and shipping AI-powered features.
  </text>

  <!-- subtle frame -->
  <rect x="0.5" y="0.5" width="1199" height="319" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
</svg>
